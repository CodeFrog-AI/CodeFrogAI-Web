[package]
name = "codefrog-desktop"
version = "0.1.0"
description = "CodeFrog desktop application shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codefrog_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Plugins are limited to the folder picker on purpose: no filesystem, shell, or Git plugin.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
