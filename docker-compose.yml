services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codefrog-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: codefrog
      POSTGRES_PASSWORD: codefrog_dev
      POSTGRES_DB: codefrog

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  